services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    image: ${REGISTRY:-local}/mern-backend:${TAG:-latest}
    restart: always
    environment:
      MONGO_URL: mongodb://mongo:27017/mern
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    image: ${REGISTRY:-local}/mern-frontend:${TAG:-latest}
    restart: always
caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from attirenotes.duckdns.org --to frontend:80
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    depends_on:
      - backend

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
